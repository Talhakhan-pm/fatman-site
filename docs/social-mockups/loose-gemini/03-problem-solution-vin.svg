<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1080 1080' width='100%' height='100%' style='background-color:#0f172a; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;'><rect width='1080' height='1080' fill='#0f172a'/><g opacity='0.1'><circle cx='1080' cy='540' r='400' fill='none' stroke='#ea580c' stroke-width='8'/><circle cx='1080' cy='540' r='600' fill='none' stroke='#ea580c' stroke-width='4'/></g><text x='80' y='110' font-size='24' font-weight='800' fill='#ea580c' letter-spacing='3'>FATMAN SOLUTIONS</text><text x='80' y='180' font-size='48' font-weight='800' fill='#ffffff' letter-spacing='-1'>Are wrong parts clogging your bays?</text><text x='80' y='225' font-size='20' fill='#64748b'>The wrong trim spec costs you time, money, and client trust.</text><g transform='translate(80, 280)'><rect width='920' height='180' rx='16' fill='#fff7ed' stroke='#ea580c' stroke-width='2'/><rect x='30' y='30' width='140' height='34' rx='17' fill='#c2410c'/><text x='100' y='52' text-anchor='middle' font-size='14' font-weight='800' fill='#ffffff'>THE PROBLEM</text><text x='30' y='110' font-size='26' font-weight='800' fill='#0f172a'>Mid-rebuild surprises.</text><text x='30' y='142' font-size='18' fill='#334155' font-weight='500'>Ordering a bumper only to find out the sensor-hole cutouts don't match the trim.</text><path d='M 820 60 L 860 100 M 860 60 L 820 100' stroke='#c2410c' stroke-width='6' stroke-linecap='round'/></g><g transform='translate(80, 490)'><rect width='920' height='360' rx='16' fill='#ffffff' stroke='#e2e8f0' stroke-width='1.5'/><rect x='30' y='35' width='140' height='34' rx='17' fill='#ea580c'/><text x='100' y='57' text-anchor='middle' font-size='14' font-weight='800' fill='#ffffff'>OUR SOLUTION</text><text x='30' y='115' font-size='32' font-weight='800' fill='#0f172a'>Precision VIN-Match Guarantee</text><text x='30' y='155' font-size='18' fill='#64748b' font-weight='500'>Input your vehicle's VIN at checkout. Our database verifies fitment with original build sheets.</text><g transform='translate(30, 200)'><rect width='860' height='90' rx='12' fill='#f7f8fa' stroke='#e2e8f0' stroke-width='2'/><text x='30' y='42' font-size='14' font-weight='700' fill='#64748b' letter-spacing='1.5'>ENTER 17-DIGIT VIN FOR ANY VEHICLE</text><text x='30' y='68' font-size='22' font-weight='800' fill='#334155' letter-spacing='3'>1 F T F W 1 E D 5 C K <tspan fill='#ea580c'>XXXXXX</tspan></text><rect x='640' y='20' width='190' height='50' rx='8' fill='#ea580c'/><text x='735' y='51' text-anchor='middle' font-size='16' font-weight='800' fill='#ffffff'>VERIFY FITMENT</text></g><circle cx='840' cy='105' r='30' fill='#fff7ed'/><path d='M 828 105 L 836 113 L 852 97' stroke='#ea580c' stroke-width='5' stroke-linecap='round' stroke-linejoin='round' fill='none'/></g><rect x='80' y='910' width='920' height='1' fill='#64748b' opacity='0.3'/><text x='80' y='970' font-size='26' font-weight='800' fill='#ffffff'>FATMAN<tspan fill='#ea580c'>PARTS</tspan></text><text x='1000' y='970' text-anchor='end' font-size='18' font-weight='600' fill='#64748b'>Save your bay time. Shop smarter.</text></svg>